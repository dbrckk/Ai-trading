name: DAX MTF Refinement

on:
  push:
    branches: ["feat/mtf-parameter-benchmark"]
    paths:
      - ".github/workflows/dax-mtf-refinement.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run DAX refinement
        run: |
          python - <<'PY'
          import json
          from ai_trading.data import load_history
          from ai_trading.mtf_parameter_benchmark import (
              MTFBenchmarkConfig,
              benchmark_payload,
              run_parameter_benchmark,
              write_benchmark_report,
          )

          configs = tuple(
              MTFBenchmarkConfig(
                  horizon_bars=horizon,
                  minimum_threshold=0.0005,
                  atr_multiplier=0.25,
                  max_train_rows=train_rows,
                  min_confidence=confidence,
              )
              for horizon in (6, 9, 12)
              for train_rows in (750, 1000, 1500, 2000)
              for confidence in (0.50, 0.52, 0.54, 0.56)
          )
          markets = {"^GDAXI": load_history("^GDAXI", "1mo", "5m")}
          results = run_parameter_benchmark(
              markets,
              configs,
              folds=2,
              test_window_bars=48,
              min_train_rows=500,
          )
          write_benchmark_report(
              results,
              json_path="artifacts/dax_mtf_refinement/results.json",
              markdown_path="artifacts/dax_mtf_refinement/report.md",
          )
          print(json.dumps(benchmark_payload(results), sort_keys=True))
          PY
      - name: Print report
        if: always()
        run: |
          if [ -f artifacts/dax_mtf_refinement/report.md ]; then
            cat artifacts/dax_mtf_refinement/report.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dax-mtf-refinement
          path: artifacts/dax_mtf_refinement
          if-no-files-found: warn
