name: Hosted Dashboard Probe

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional deployed Render Git SHA to verify (40 hex characters)"
        required: false
        type: string
  schedule:
    - cron: "17 */2 * * *"
  push:
    branches: ["main", "fix/hosted-probe-transient-starting"]
    paths:
      - render.yaml
      - Dockerfile
      - src/ai_trading/dashboard.py
      - src/ai_trading/deployment_probe.py
      - tests/test_dashboard_health.py
      - .github/workflows/hosted-dashboard-probe.yml

permissions:
  contents: read

concurrency:
  group: hosted-dashboard-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DASHBOARD_URL: https://ai-trading-dashboard-qyr2.onrender.com
      PYTHONPATH: src
      EXPECTED_DEPLOY_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify liveness, durable readiness and market cards
        run: |
          args=(--base-url "${DASHBOARD_URL}" --timeout 60 --require-running-markets)
          if [ -n "${EXPECTED_DEPLOY_SHA}" ]; then
            args+=(--expected-sha "${EXPECTED_DEPLOY_SHA}")
          fi
          python -m ai_trading.deployment_probe "${args[@]}"
