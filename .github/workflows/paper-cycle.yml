name: Paper Cycle

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-cycle-production
  cancel-in-progress: false

jobs:
  paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_TRADING_DATABASE_URL: ${{ secrets.AI_TRADING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Require durable database
        shell: bash
        run: |
          if [ -z "${AI_TRADING_DATABASE_URL:-}" ]; then
            echo "::error::AI_TRADING_DATABASE_URL repository secret is required"
            exit 1
          fi
      - name: Install
        run: python -m pip install .
      - name: Run paper cycle
        run: ai-trading paper-cycle --symbol GC=F --period 5d --interval 5m --max-catchup-bars 12
